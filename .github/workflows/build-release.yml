name: Build Insta10

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid xz
          export THEOS="$RUNNER_TEMP/theos"
          git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS10.3.sdk.tar.xz \
            | tar -xJ -C "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build Debian package
        run: make clean package FINALPACKAGE=1

      - name: Keep package as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Insta10-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish release for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$release_tag" packages/*.deb \
            --title "Insta10 build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from commit ${GITHUB_SHA}." \
            --prerelease \
            --target "$GITHUB_SHA"

          package_file=(packages/*.deb)
          cp "${package_file[0]}" packages/Insta10-latest.deb
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              --field sha="$GITHUB_SHA" --field force=true >/dev/null
            gh release upload latest packages/Insta10-latest.deb \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit latest --repo "$GITHUB_REPOSITORY" \
              --title "Insta10 latest" \
              --notes "Latest successful main build from commit ${GITHUB_SHA}."
          else
            gh release create latest packages/Insta10-latest.deb \
              --repo "$GITHUB_REPOSITORY" \
              --title "Insta10 latest" \
              --notes "Latest successful main build from commit ${GITHUB_SHA}." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
